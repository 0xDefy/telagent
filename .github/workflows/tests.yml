name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
      - name: Test collection, storage, and message feeds
        run: python -m unittest discover -s tests -v
      - run: python -m compileall -q telagent.py gui.py settings.py platform_utils.py launch.py
      - name: Check Unix launchers
        if: runner.os != 'Windows'
        run: |
          sh -n open-telagent.sh
          sh -n 'Open Telagent.command'
      - name: Test dark desktop and feed picker on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/smoke_gui.py
      - name: Test dark desktop and feed picker on Windows
        if: runner.os == 'Windows'
        run: python tests/smoke_gui.py
      - name: Verify private files are ignored
        if: runner.os == 'Linux' && matrix.python == '3.13'
        shell: bash
        run: |
          for path in .env .env.local config.json data/channels.json data/telegram.session data/messages.sqlite3 data/messages/example.json; do
            git check-ignore -q -- "$path" || { echo "Missing ignore rule for $path"; exit 1; }
          done
          if [[ -n "$(git ls-files --cached --ignored --exclude-standard)" ]]; then
            echo 'A tracked file matches a local or private file ignore rule.'
            exit 1
          fi
