name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q telagent.py gui.py settings.py platform_utils.py launch.py
      - if: runner.os == 'Linux'
        run: |
          sh -n open-telagent.sh
          sh -n 'Open Telagent.command'
          xvfb-run -a python tests/smoke_gui.py
      - if: runner.os == 'Windows'
        run: python tests/smoke_gui.py
